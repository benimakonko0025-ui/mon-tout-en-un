<script>
(function(){
"use strict";
/* ================= CONTENU ================= */
const MODS=[
{id:"m1",t:"Les bases du terminal",d:"Le trajet d'un conteneur import et les acteurs",L:[
 {t:"Le flux import",p:["Un conteneur import suit toujours le même chemin : navire, quai, parc, puis sortie par la porte.","Le planner prépare ce chemin avant l'arrivée du navire : où décharger, dans quel ordre, et où poser chaque conteneur dans le parc."],u:["Avant l'arrivée : réception du bay plan et de la liste de déchargement, préparation du parc.","À quai : déchargement par les portiques ou les grues, transfert vers le parc.","Au parc : stockage, visite douane éventuelle, branchement des reefers.","Livraison : le client ou son transitaire vient chercher le conteneur après les formalités."]},
 {t:"Qui fait quoi",u:["Armateur (shipping line) : possède ou exploite le navire, vend le transport.","Agent maritime / consignataire : représente l'armateur au port, transmet les documents.","Terminal : décharge, stocke et livre les conteneurs.","Douane : autorise ou bloque la sortie de la marchandise.","Transitaire (freight forwarder) : s'occupe des formalités pour le client.","Bord (chief officer) : responsable de la stabilité et de l'arrimage du navire."]},
 {t:"Conteneurs et unités",u:["20 pieds = 1 EVP (TEU). 40 pieds = 2 EVP.","Un mouvement (move) = un levage. Un 40 pieds compte 1 mouvement mais 2 EVP.","Types courants : dry (DV), high cube (HC), reefer (RF), open top (OT), flat rack (FR), citerne (TK).","Tare = poids du conteneur vide. Poids brut = tare + marchandise.","VGM : masse brute vérifiée, exigée par la convention SOLAS avant tout embarquement à l'export."]},
 {t:"Le numéro de conteneur",p:["Norme ISO 6346 : 4 lettres, 6 chiffres, puis 1 chiffre de contrôle."],u:["Les 3 premières lettres : le code du propriétaire.","La 4e lettre : la catégorie. U = conteneur, J = équipement, Z = châssis.","Le dernier chiffre se calcule à partir des 10 premiers caractères. S'il ne correspond pas, il y a une erreur de saisie.","L'onglet Calculs contient un vérificateur de numéro."]}
]},
{id:"m2",t:"Lire un bay plan",d:"Baie, rangée, étage : trouver n'importe quelle position",L:[
 {t:"Baie, rangée, étage",p:["Chaque position à bord a une adresse en 6 chiffres : baie (bay), rangée (row), étage (tier). Exemple : 06 03 82."],u:["Baie : position dans la longueur du navire, de l'avant vers l'arrière.","Rangée : position dans la largeur.","Étage : position en hauteur."]},
 {t:"Les baies",u:["Numéros impairs (01, 03, 05) : emplacements de 20 pieds.","Numéros pairs (02, 06, 10) : emplacements de 40 pieds, à cheval sur deux baies de 20.","Exemple : la baie 02 couvre les baies 01 et 03."]},
 {t:"Les rangées et les étages",u:["Rangée 00 : l'axe du navire, quand il existe.","Rangées impaires (01, 03, 05) : vers tribord (starboard).","Rangées paires (02, 04, 06) : vers bâbord (port).","Étages en cale : 02, 04, 06… en montant.","Étages en pontée : à partir de 82 (parfois 80), puis 84, 86…"]},
 {t:"Ce que le plan t'apprend",u:["Le port de déchargement de chaque conteneur, souvent par couleur ou par code.","Le poids, le type, les marchandises dangereuses, les reefers et les hors gabarit.","Les panneaux de cale (hatch covers) : rien ne sort de la cale tant que la pontée au-dessus n'est pas libérée.","Les restows : conteneurs à déplacer alors qu'ils ne sont pas pour ton port."]}
]},
{id:"m3",t:"Planifier le navire",d:"Séquence, répartition des portiques, contraintes",L:[
 {t:"L'ordre des opérations",u:["Déchargement : la pontée d'abord, puis le panneau de cale, puis la cale.","Chargement : la cale d'abord, on referme le panneau, puis la pontée.","En général on décharge une baie avant de la recharger, sauf organisation en double cycle.","Les restows se planifient avec le bord : à quai ou de bord à bord."]},
 {t:"Le crane split",p:["C'est la répartition des mouvements entre les portiques. Le but : que tous finissent à peu près en même temps."],u:["Compter les mouvements par baie, puis regrouper les baies par portique.","Le portique qui a le plus de travail s'appelle le long crane : c'est lui qui fixe l'heure de fin du navire.","Si un portique finit bien avant les autres, on lui redonne des baies du long crane, si la distance le permet.","Deux portiques ne peuvent pas travailler côte à côte : il faut un écart, souvent une baie de 40 pieds, selon les engins."]},
 {t:"Les contraintes à vérifier",u:["Panneaux de cale : où les poser, et dans quel ordre.","Saisissage (lashing) : il faut désaisir avant de décharger et saisir après le chargement.","Marchandises dangereuses, reefers, hors gabarit : traitement et position particuliers.","Stabilité : toute modification de séquence importante se valide avec le bord.","Disponibilité des engins de parc : le portique ne doit pas attendre les tracteurs."]},
 {t:"Les messages EDI",u:["BAPLIE : le bay plan, positions occupées et libres.","MOVINS : les instructions d'arrimage données au terminal.","COPRAR : l'ordre de déchargement ou de chargement.","COARRI : le compte rendu des conteneurs déchargés ou chargés.","CODECO : le compte rendu des entrées et sorties par la porte.","IFTDGN : la déclaration des marchandises dangereuses."]}
]},
{id:"m4",t:"Cadence et productivité",d:"Mesurer, calculer, annoncer une heure de fin",L:[
 {t:"Les indicateurs",p:["Les définitions exactes varient d'un terminal à l'autre. Utilise toujours celles de ton terminal dans les rapports."],u:["Cadence brute par portique (GMPH) : mouvements ÷ heures brutes du portique, arrêts compris.","Cadence nette (NMPH) : mouvements ÷ heures réellement travaillées, arrêts déduits.","Productivité à quai (BMPH) : total des mouvements du navire ÷ heures passées à quai.","Intensité de portiques (crane intensity) : total des heures portique ÷ heures de travail du navire. C'est le nombre moyen de portiques engagés."]},
 {t:"Exemple chiffré",p:["Un portique fait 168 mouvements en 7 heures, dont 1 heure d'arrêt."],u:["Cadence brute : 168 ÷ 7 = 24 mouvements par heure.","Cadence nette : 168 ÷ 6 = 28 mouvements par heure.","L'écart entre les deux montre le poids des arrêts : c'est là que se gagne le temps."]},
 {t:"Estimer la fin des opérations",u:["Pour chaque portique : mouvements restants ÷ cadence réelle observée = heures restantes.","Le portique qui a le plus d'heures restantes donne l'heure de fin.","Ajouter les temps fixes : panneaux de cale, saisissage, relèves, pauses.","Recalculer à chaque relève : une estimation vieille de quatre heures ne vaut plus rien."]},
 {t:"Enregistrer les arrêts",u:["Noter chaque arrêt : heure de début, heure de fin, cause, portique concerné.","Classer la cause : terminal (panne, attente tracteur), navire (saisissage, panneau, ballast), météo, tiers.","Ces relevés servent au rapport d'escale et aux discussions avec l'armateur. Sans heure précise, un arrêt ne se prouve pas."]}
]},
{id:"m5",t:"Le parc import",d:"Empiler pour livrer vite, sans déplacements inutiles",L:[
 {t:"Pourquoi l'import est difficile",p:["À l'export on connaît l'ordre d'embarquement. À l'import, on ne sait pas quel client viendra en premier."],u:["Chaque conteneur placé au-dessus d'un autre peut devenir un déplacement inutile (rehandle).","Plus les piles sont hautes, plus il y a de déplacements à la livraison.","L'objectif : livrer avec le moins de mouvements improductifs possible."]},
 {t:"Règles d'empilage",u:["Séparer par taille : jamais de 20 pieds sur un 40 pieds.","Regrouper par navire et par date d'arrivée : les plus anciens partent en général d'abord.","Regrouper par client ou par connaissement quand les lots sont importants.","Zones réservées : reefers près des prises, marchandises dangereuses, hors gabarit, visite douane.","Les lourds en bas, les légers en haut, et respecter la hauteur autorisée."]},
 {t:"Occupation et séjour",u:["Taux d'occupation = EVP présents ÷ capacité du parc.","On considère souvent qu'au-delà de 70 à 80 % le parc perd en efficacité : moins de place pour manœuvrer, plus de déplacements.","Durée de séjour (dwell time) : nombre moyen de jours entre le déchargement et la sortie.","Un séjour long remplit le parc. Le suivre aide à prévoir la place avant le prochain navire."]},
 {t:"Préparer le parc avant le navire",u:["Compter les emplacements libres par zone et par taille.","Réserver la place du navire attendu avant son arrivée.","Faire le rangement (housekeeping) pendant les heures creuses.","Prévoir les prises reefer disponibles et les places dangereux.","Vérifier que les allées de circulation restent libres."]}
]},
{id:"m6",t:"Cargaisons spéciales",d:"Reefers, dangereux, hors gabarit",L:[
 {t:"Les reefers",u:["Brancher le plus vite possible après le déchargement.","Vérifier la température de consigne (set point) sur le document et sur l'afficheur.","Relever la température à intervalles réguliers, selon la procédure du terminal, et noter chaque relevé.","Ne jamais modifier un réglage sans instruction écrite.","Signaler tout écart ou alarme immédiatement : la marchandise se perd en quelques heures."]},
 {t:"Les marchandises dangereuses",p:["Le code IMDG les répartit en 9 classes."],u:["1 Explosifs · 2 Gaz · 3 Liquides inflammables","4 Solides inflammables · 5 Comburants et peroxydes","6 Toxiques et infectieux · 7 Radioactifs","8 Corrosifs · 9 Dangers divers","La ségrégation fixe les distances à respecter entre classes, à bord comme au parc.","Toujours vérifier la déclaration, la classe, le numéro ONU et les étiquettes avant de manipuler."]},
 {t:"Les hors gabarit",u:["OOG (out of gauge) : la marchandise dépasse du conteneur en hauteur, en largeur ou en longueur.","Il faut un matériel de levage adapté et souvent plus de temps par mouvement.","Rien ne peut être posé au-dessus ni parfois à côté : cela consomme des emplacements.","Prévoir leur place et leur moment dans la séquence, pas à la dernière minute."]}
]},
{id:"m7",t:"Stabilité et arrimage",d:"Les notions qu'un superintendent doit comprendre",L:[
 {t:"Les mots de la stabilité",p:["La stabilité est sous la responsabilité du bord. Le terminal doit comprendre ces notions pour ne pas la mettre en danger."],u:["Gîte (list) : le navire penche sur un côté.","Assiette (trim) : différence de tirant d'eau entre l'avant et l'arrière.","GM : hauteur métacentrique, la mesure de la stabilité initiale. Des poids lourds en bas l'augmentent, des poids lourds en haut la réduisent.","Le ballast sert à corriger la gîte et l'assiette pendant les opérations."]},
 {t:"Ce que le terminal doit respecter",u:["Les plus lourds en bas des piles, les plus légers en haut.","Le poids maximal par pile (stack weight) indiqué par le navire.","Travailler de façon équilibrée entre bâbord et tribord pour limiter la gîte.","La ligne de visibilité depuis la passerelle : pas de pontée trop haute à l'avant.","Tout changement par rapport au plan validé se demande au chief officer."]},
 {t:"Le saisissage",u:["Twistlocks : verrous placés aux coins, entre deux conteneurs. Manuels, semi-automatiques ou automatiques.","Barres de saisissage (lashing rods) et ridoirs (turnbuckles) : tiennent les étages bas de la pontée.","En cale, les glissières (cell guides) guident et maintiennent les piles.","Le navire ne part pas tant que le saisissage n'est pas terminé et accepté par le bord."]}
]},
{id:"m8",t:"Le superintendent",d:"Le lien entre le navire et le terminal",L:[
 {t:"Son rôle",u:["Il suit l'escale du début à la fin pour le compte de l'armateur ou du terminal.","Il fait le lien entre le bord, le planner, les chefs de quai et l'agent.","Il veille à trois choses : la sécurité, le respect du plan, le respect des délais.","Il consigne les faits : heures, arrêts, dommages, écarts."]},
 {t:"Avant l'arrivée",u:["Vérifier les documents reçus : bay plan, liste de déchargement, dangereux, reefers, hors gabarit.","Valider la séquence et la répartition des portiques avec le planner.","Confirmer le poste à quai, l'heure d'arrivée, les équipes et les engins.","Repérer les points sensibles : restows, panneaux de cale, cargaisons spéciales.","Tenir la réunion de préparation avec tous les intervenants."]},
 {t:"Pendant les opérations",u:["Rencontrer le chief officer dès l'accostage et confirmer le plan.","Suivre l'avancement réel par rapport au plan, portique par portique.","Noter chaque arrêt avec son heure et sa cause.","Faire constater tout dommage au moment où il est découvert, avec photo et signature si possible.","Suivre les reefers et les dangereux jusqu'à leur zone."]},
 {t:"Avant le départ",u:["Vérifier que tout ce qui devait être déchargé et chargé l'a été.","Obtenir le bay plan final et le faire valider par le bord.","Confirmer la fin du saisissage.","Faire signer le relevé des faits (Statement of Facts) : heures d'arrivée, de début, de fin, arrêts.","Rédiger le rapport de départ (Terminal Departure Report) avec les chiffres de l'escale."]}
]},
{id:"m9",t:"Sécurité au quai",d:"Les réflexes qui évitent l'accident",L:[
 {t:"Les règles de base",u:["Porter les équipements : casque, gilet haute visibilité, chaussures de sécurité, gants.","Ne jamais passer ni rester sous une charge suspendue.","Rester visible des conducteurs d'engins et hors de leur trajectoire.","Respecter les zones interdites pendant le travail des portiques."]},
 {t:"Sur le navire",u:["Le désaisissage et le saisissage se font avec les protections prévues, jamais sous un levage en cours.","Attention aux chutes : bords de cale, panneaux ouverts, passerelles.","Les twistlocks tombés sont un danger : casque obligatoire à quai et à bord."]},
 {t:"Savoir arrêter",u:["Toute personne peut arrêter une opération dangereuse : c'est un devoir.","Vent fort : les portiques s'arrêtent à la limite fixée par le terminal.","Communication radio courte et claire, avec répétition de l'ordre reçu.","Après un incident : sécuriser, alerter, puis consigner les faits et l'heure."]}
]},
{id:"m10",t:"Rapports et communication",d:"Écrire court, exact, et à l'heure",L:[
 {t:"Un bon rapport de relève",u:["Ce qui est fait, ce qui reste, ce qui bloque.","Des chiffres : mouvements réalisés, restants, cadence, heure de fin estimée.","Les arrêts avec leurs heures et leurs causes.","Les consignes pour l'équipe suivante.","Une phrase par idée. Pas d'opinion, des faits."]},
 {t:"Formules utiles en anglais",u:["Vessel all fast at 06:40. Navire amarré à 06 h 40.","Operations commenced at 07:15. Début des opérations à 07 h 15.","Crane 2 stopped from 10:05 to 10:40 due to breakdown. Portique 2 arrêté de 10 h 05 à 10 h 40 pour panne.","Discharge completed, loading in progress. Déchargement terminé, chargement en cours.","Estimated time of completion 22:30. Fin des opérations estimée à 22 h 30.","Please confirm the final bay plan. Merci de confirmer le bay plan final."]},
 {t:"Rester à la hauteur",u:["Chaque escale : noter une chose qui a bien marché et une chose à améliorer.","Comparer la cadence prévue et la cadence réelle, et chercher la cause de l'écart.","Faire l'entraînement du jour : cinq questions suffisent pour garder les réflexes.","Relire un module par semaine."]}
]}
];

const Q=[
["m1","Un 40 pieds compte pour combien d'EVP ?",["1","2","4"],1,"20 pieds = 1 EVP, 40 pieds = 2 EVP."],
["m1","Un portique décharge 10 conteneurs de 40 pieds. Combien de mouvements ?",["10","20","40"],0,"Un mouvement = un levage, quelle que soit la taille."],
["m1","Dans un numéro de conteneur, à quoi sert le dernier chiffre ?",["Indiquer la taille","Contrôler la saisie","Indiquer le pays"],1,"C'est le chiffre de contrôle, calculé à partir des 10 premiers caractères."],

const KEY="formation-v1";

const say=t=>{$("status").textContent=t||""};
const p2=n=>String(n).padStart(2,"0");
const dayKey=(d)=>{d=d||new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(timer);timer=setTimeout(push,900)}
async function push(){if(!col)return;try{await col.doc("form_state").set({v:JSON.stringify(S),t:S.t});say("Progression enregistrée dans ton compte.")}catch(e){say("Progression gardée sur cet appareil pour le moment.")}}
function streak(){let n=0;const d=new Date();if(!S.days[dayKey(d)])d.setDate(d.getDate()-1);while(S.days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
const lessonsTotal=MODS.reduce((a,m)=>a+m.L.length,0);
const lessonsDone=()=>MODS.reduce((a,m)=>a+m.L.filter((_,i)=>S.done[m.id+"."+i]).length,0);

let tab="home",cur=null;
function show(t){tab=t;cur=null;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===t)));draw()}

function vHome(v){
  const st=el("div","stat");
  [[streak(),"jours de suite"],[lessonsDone()+" / "+lessonsTotal,"leçons lues"],[mastered()+" / "+Q.length,"questions acquises"]].forEach(([n,l])=>{const d=el("div");d.appendChild(el("b",null,String(n)));d.appendChild(el("small",null,l));st.appendChild(d)});
  v.appendChild(st);
  const c=el("div","card");c.style.marginTop="12px";c.appendChild(el("h2",null,"Entraînement du jour"));
  const today=S.days[dayKey()];
  c.appendChild(el("p","hint",today?"Fait aujourd'hui : "+today+" / 5. Tu peux recommencer une série.":"Cinq questions, deux minutes. Celles que tu rates reviennent plus souvent."));
  const b=el("button","b p",today?"Refaire une série":"Commencer");b.style.marginTop="10px";b.addEventListener("click",()=>startQuiz(pick(5),"Entraînement du jour",true));c.appendChild(b);v.appendChild(c);
  const next=nextLesson();
  if(next){const n=el("div","card");n.appendChild(el("h2",null,"Leçon suivante"));n.appendChild(el("p","hint",next.m.t+" · "+next.m.L[next.i].t));
    const nb=el("button","b","Ouvrir");nb.style.marginTop="10px";nb.addEventListener("click",()=>{tab="cours";document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.t==="cours")));openLesson(next.m,next.i)});n.appendChild(nb);v.appendChild(n)}

  v.appendChild(el("p","hint","Contenu général du métier. Les procédures et les définitions de ton terminal passent toujours avant."));
}
function nextLesson(){for(const m of MODS)for(let i=0;i<m.L.length;i++)if(!S.done[m.id+"."+i])return{m,i};return null}
function pick(n){const w=Q.map(q=>({q,w:(S.q[q.id]||0)<=0?4:(S.q[q.id]===1?2:1)}));const out=[];
  while(out.length<n&&w.length){let tot=w.reduce((a,x)=>a+x.w,0),r=Math.random()*tot,i=0;for(;i<w.length;i++){r-=w[i].w;if(r<=0)break}i=Math.min(i,w.length-1);out.push(w[i].q);w.splice(i,1)}return out}

function vCours(v){
  if(cur){drawLesson(v);return}
  MODS.forEach((m,k)=>{const dn=m.L.filter((_,i)=>S.done[m.id+"."+i]).length,qs=Q.filter(q=>q.m===m.id),qm=qs.filter(q=>(S.q[q.id]||0)>=2).length;
    const c=el("div","card");const h=el("h2",null,(k+1)+". "+m.t);if(dn===m.L.length&&qm===qs.length)h.appendChild(el("span","tag ok","acquis"));c.appendChild(h);c.appendChild(el("p","hint",m.d));
    const bar=el("div","bar"),i=el("i");i.style.width=Math.round(dn/m.L.length*100)+"%";bar.appendChild(i);c.appendChild(bar);
    m.L.forEach((l,j)=>{const b=el("button","opt",(S.done[m.id+"."+j]?"✓ ":"")+l.t);b.addEventListener("click",()=>openLesson(m,j));c.appendChild(b)});
    const qb=el("button","b","Quiz du module · "+qm+" / "+qs.length);qb.style.marginTop="10px";qb.addEventListener("click",()=>startQuiz(qs.slice().sort(()=>Math.random()-.5),"Quiz : "+m.t,false));c.appendChild(qb);
    v.appendChild(c)});
}
function openLesson(m,i){cur={m,i};draw()}
function drawLesson(v){const{m,i}=cur,l=m.L[i];
  const back=el("button","b","‹ Parcours");back.addEventListener("click",()=>{cur=null;draw()});v.appendChild(back);
  const c=el("div","card lesson");c.style.marginTop="12px";c.appendChild(el("p","hint",m.t+" · leçon "+(i+1)+" / "+m.L.length));c.appendChild(el("h2",null,l.t));
  (l.p||[]).forEach(t=>c.appendChild(el("p",null,t)));
  if(l.u){const ul=el("ul");l.u.forEach(t=>ul.appendChild(el("li",null,t)));c.appendChild(ul)}
  v.appendChild(c);
  const r=el("div","row");
  const ok=el("button","b p",S.done[m.id+"."+i]?"Leçon lue ✓":"J'ai compris");ok.addEventListener("click",()=>{S.done[m.id+"."+i]=1;save();if(i+1<m.L.length)openLesson(m,i+1);else{cur=null;draw()}});r.appendChild(ok);

/* ---------- quiz ---------- */
function startQuiz(list,title,daily){const v=$("view");let k=0,score=0;
  function step(){v.textContent="";window.scrollTo(0,0);
    if(k>=list.length){const c=el("div","card");c.appendChild(el("h2",null,"Résultat : "+score+" / "+list.length));
      c.appendChild(el("p","hint",score===list.length?"Sans faute.":score>=list.length*0.6?"Bien. Les questions ratées reviendront.":"À revoir : relis le module concerné, puis recommence."));
      if(daily){S.days[dayKey()]=Math.max(S.days[dayKey()]||0,score)}save();
      const b=el("button","b p","Terminer");b.style.marginTop="10px";b.addEventListener("click",draw);c.appendChild(b);v.appendChild(c);return}
    const q=list[k],c=el("div","card");c.appendChild(el("p","hint",title+" · "+(k+1)+" / "+list.length));c.appendChild(el("h2",null,q.q));
    const exp=el("div","exp");exp.setAttribute("role","status");let answered=false;
    q.o.forEach((o,i)=>{const b=el("button","opt",o);b.addEventListener("click",()=>{if(answered)return;answered=true;
      const good=i===q.a;if(good){score++;S.q[q.id]=Math.min(3,(S.q[q.id]||0)+1)}else S.q[q.id]=0;
      c.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("good");else if(j===i)x.classList.add("bad")});
      exp.textContent=(good?"Juste. ":"Pas tout à fait. ")+q.e;nx.hidden=false;nx.focus()});c.appendChild(b)});
    c.appendChild(exp);const nx=el("button","b p",k+1<list.length?"Suivante":"Voir le résultat");nx.hidden=true;nx.style.marginTop="10px";nx.addEventListener("click",()=>{k++;step()});c.appendChild(nx);v.appendChild(c)}
  step();
}

const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const f1=n=>(Math.round(n*10)/10).toLocaleString("fr-FR");
function field(g,label,id,val,type){const d=el("div");const l=el("label",null,label);l.htmlFor=id;const i=el("input");i.id=id;i.type=type||"text";if(!type)i.inputMode="decimal";i.value=val==null?"":val;d.appendChild(l);d.appendChild(i);g.appendChild(d);return i}
function calc(v,title,hint,build){const c=el("div","card");c.appendChild(el("h2",null,title));c.appendChild(el("p","hint",hint));const g=el("div","kv");c.appendChild(g);const r=el("div","res");r.setAttribute("aria-live","polite");c.appendChild(r);
  const upd=build(g,r);c.addEventListener("input",upd);upd();v.appendChild(c)}
function hhmm(str,addH){const m=/^(\d{1,2}):(\d{2})$/.exec(str||"");if(!m)return null;let t=(+m[1])*60+(+m[2])+Math.round(addH*60);const d=Math.floor(t/1440);t=((t%1440)+1440)%1440;return p2(Math.floor(t/60))+" h "+p2(t%60)+(d>0?" (J+"+d+")":"")}
function vCalc(v){
  calc(v,"Cadence d'un portique","Mouvements réalisés, durée brute et arrêts.",(g,r)=>{const a=field(g,"Mouvements","k1","168"),b=field(g,"Heures brutes","k2","7"),c=field(g,"Arrêts (minutes)","k3","60");
    return()=>{const m=num(a.value),h=num(b.value),s=num(c.value)/60;r.textContent="";if(m<=0||h<=0){r.textContent="Saisis les mouvements et la durée.";return}
      r.appendChild(el("b",null,f1(m/h)+" mvts/h brut"));r.appendChild(el("div",null,h-s>0?"Net : "+f1(m/(h-s))+" mvts/h sur "+f1(h-s)+" h travaillées":"Les arrêts dépassent la durée."))}});
  calc(v,"Heure de fin des opérations","Mouvements restants et cadence réelle de chaque portique. Laisse vide un portique non utilisé.",(g,r)=>{
    const st=field(g,"Heure actuelle","e0",p2(new Date().getHours())+":"+p2(new Date().getMinutes()),"time"),fx=field(g,"Temps fixes à ajouter (min)","e9","30");
    const P=[1,2,3,4].map(n=>[field(g,"Portique "+n+" : restants","e"+n+"a",n===1?"150":n===2?"90":""),field(g,"Portique "+n+" : cadence","e"+n+"b",n<3?"25":"")]);
    return()=>{r.textContent="";const rows=P.map(([a,b],i)=>({n:i+1,m:num(a.value),c:num(b.value)})).filter(x=>x.m>0&&x.c>0);if(!rows.length){r.textContent="Saisis au moins un portique.";return}
      rows.forEach(x=>x.h=x.m/x.c);const lc=rows.reduce((a,x)=>x.h>a.h?x:a,rows[0]),tot=lc.h+num(fx.value)/60;
      r.appendChild(el("b",null,"Fin estimée : "+(hhmm(st.value,tot)||"dans "+f1(tot)+" h")));
      r.appendChild(el("div",null,"Long crane : portique "+lc.n+", "+f1(lc.h)+" h restantes"));
      rows.forEach(x=>r.appendChild(el("div","hint","Portique "+x.n+" : "+f1(x.h)+" h")))}});
  calc(v,"Productivité du navire","Pour le rapport d'escale.",(g,r)=>{const a=field(g,"Total des mouvements","b1","900"),b=field(g,"Heures à quai","b2","18"),c=field(g,"Total heures portique","b3","40"),d=field(g,"Heures de travail navire","b4","16");
    return()=>{r.textContent="";const m=num(a.value),q=num(b.value),ch=num(c.value),w=num(d.value);
      if(m>0&&q>0)r.appendChild(el("b",null,f1(m/q)+" mvts/h à quai"));
      if(m>0&&ch>0)r.appendChild(el("div",null,"Cadence moyenne par portique : "+f1(m/ch)+" mvts/h"));
      if(ch>0&&w>0)r.appendChild(el("div",null,"Intensité : "+f1(ch/w)+" portiques en moyenne"));
      if(!r.childNodes.length)r.textContent="Saisis les valeurs."}});
  calc(v,"Occupation du parc","Avant et après le prochain navire.",(g,r)=>{const a=field(g,"Capacité (EVP)","p1","4000"),b=field(g,"EVP présents","p2","2800"),c=field(g,"À décharger (EVP)","p3","600"),d=field(g,"Sorties prévues (EVP)","p4","200");
    return()=>{r.textContent="";const cap=num(a.value),now=num(b.value);if(cap<=0){r.textContent="Saisis la capacité.";return}
      const after=now+num(c.value)-num(d.value);r.appendChild(el("b",null,"Aujourd'hui : "+f1(now/cap*100)+" %"));
      r.appendChild(el("div",null,"Après le navire : "+f1(after/cap*100)+" % ("+Math.round(after).toLocaleString("fr-FR")+" EVP)"));
      r.appendChild(el("div","hint",after>cap?"Dépassement de capacité : il manque "+Math.round(after-cap)+" EVP de place.":after/cap>0.8?"Au-dessus de 80 % : prévoir du rangement et des sorties.":"Marge correcte."))}});
  calc(v,"Conversion en EVP","",(g,r)=>{const a=field(g,"Conteneurs de 20 pieds","t1","120"),b=field(g,"Conteneurs de 40 pieds","t2","200");
    return()=>{const x=num(a.value),y=num(b.value);r.textContent="";r.appendChild(el("b",null,Math.round(x+2*y).toLocaleString("fr-FR")+" EVP"));r.appendChild(el("div",null,Math.round(x+y).toLocaleString("fr-FR")+" mouvements"))}});
  calc(v,"Vérifier un numéro de conteneur","Norme ISO 6346 : 4 lettres et 7 chiffres.",(g,r)=>{const a=field(g,"Numéro","n1","CSQU3054383","text");a.inputMode="text";a.autocapitalize="characters";a.parentNode.style.gridColumn="1 / -1";
    return()=>{r.textContent="";const s=a.value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!/^[A-Z]{4}\d{6,7}$/.test(s)){r.textContent="Saisis 4 lettres puis 6 ou 7 chiffres.";return}
      const cd=checkDigit(s.slice(0,10));if(s.length===10){r.appendChild(el("b",null,"Chiffre de contrôle : "+cd));return}
      r.appendChild(el("b",null,+s[10]===cd?"Numéro valide":"Numéro incorrect"));if(+s[10]!==cd)r.appendChild(el("div",null,"Le chiffre de contrôle devrait être "+cd+". Vérifie la saisie."))}});
}
function checkDigit(s){let sum=0;for(let i=0;i<10;i++){const ch=s[i];let v;if(/\d/.test(ch))v=+ch;else{v=ch.charCodeAt(0)-55;v+=Math.floor((v-1)/10)}sum+=v*Math.pow(2,i)}return sum%11%10}

/* ---------- check-lists ---------- */
function vCheck(v){v.appendChild(el("p","hint","À cocher pendant l'escale. « Remettre à zéro » avant le navire suivant."));
  CHK.forEach(c=>{const card=el("div","card");card.appendChild(el("h2",null,c.t));
    c.i.forEach((t,i)=>{const k=c.id+"."+i,lab=el("label","chk"+(S.chk[k]?" done":"")),cb=el("input");cb.type="checkbox";cb.checked=!!S.chk[k];
      cb.addEventListener("change",()=>{if(cb.checked)S.chk[k]=1;else delete S.chk[k];lab.classList.toggle("done",cb.checked);save()});lab.appendChild(cb);lab.appendChild(el("span",null,t));card.appendChild(lab)});
    const b=el("button","b","Remettre à zéro");b.style.marginTop="10px";b.addEventListener("click",()=>{c.i.forEach((_,i)=>delete S.chk[c.id+"."+i]);save();draw()});card.appendChild(b);v.appendChild(card)});
  v.style.marginBottom="0";
}

/* ---------- lexique ---------- */
function vLex(v){const i=el("input","t");i.type="search";i.placeholder="Chercher un mot, en anglais ou en français";i.setAttribute("aria-label","Chercher dans le lexique");v.appendChild(i);
  const g=el("div","gl");g.style.marginTop="12px";v.appendChild(g);
  const fill=()=>{const s=i.value.trim().toLowerCase();g.textContent="";const L=LEX.filter(x=>!s||(x[0]+" "+x[1]).toLowerCase().includes(s));
    L.forEach(x=>{const d=el("div");d.appendChild(el("b",null,x[0]));d.appendChild(document.createTextNode(" · "+x[1]));g.appendChild(d)});
    if(!L.length)g.appendChild(el("p","hint","Aucun mot trouvé."))};
  i.addEventListener("input",fill);fill();
}

/* ================= DÉMARRAGE ================= */
draw();
(async()=>{let db=null,user=null,uid=null;
  try{if(window.claude&&typeof window.claude.use==="function")[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
  try{uid=user?await user.id():null}catch(e){}
  if(!db||!uid){say("Hors connexion : ta progression reste sur cet appareil.");return}
  col=db.collection("data/users/"+uid);
  try{const s=await col.doc("form_state").get();const x=s.exists?s.data():null;
    if(x&&typeof x.v==="string"&&(+x.t||0)>(S.t||0)){const o=JSON.parse(x.v);if(o&&typeof o==="object"){S=Object.assign({done:{},q:{},days:{},chk:{},t:0},o);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!cur&&!document.querySelector(".opt.good,.opt.bad"))draw()}}
    else if(S.t)push()}catch(e){}
})();
window.addEventListener("pagehide",()=>{if(timer){clearTimeout(timer);push()}});
})();
</script>
